[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/lint-canary"]
# The lint canary fails to compile by design; only scripts/lint-canary builds it.
default-members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
gbk-markdown-core = { path = "crates/core" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_22"] }
pangocairo = "0.22.9"
thiserror = "2.0.21"
# Remote images (docs/plan.md §4.6): a small blocking HTTP client on worker threads, TLS by
# rustls with ring, certificates checked against the system's store (no bundled roots).
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Syntax highlighting (docs/plan.md §4.6): Sublime Text grammars with a pure-Rust regex engine
# (no Oniguruma, no C), parsing only (colours are ours, GitHub's); bat's extended grammars
# (TOML, TypeScript, Dockerfile, fish, Nix...) through two-face, +0.6 MB.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
# Exact: core calls comrak::Anchorizer, which is #[doc(hidden)] and so outside semver (plan §2).
comrak = { version = "=0.56.0", default-features = false, features = ["shortcodes"] }
html5gum = "0.8.4"
proptest = "1.11.0"

# The paranoid Rust rules (docs/plan.md §7). Every member crate opts in with
# `[lints] workspace = true`; crates/lint-canary proves each lint below still fires.
# Exceptions are `#[expect(lint, reason = "...")]`, never `#[allow]`.
[workspace.lints.rust]
# Clippy appends `-D warnings` after these flags, which leaves an unknown lint a warning that
# passes. Denying it here, first, makes a misspelled or renamed lint fail the build.
unknown_lints = { level = "deny", priority = -100 }
rust_2018_idioms = { level = "deny", priority = -1 }
# deny, not forbid: main.rs sets GTK's renderer through the environment in the one #[expect]ed
# exception, and scripts/check-boundaries fails if any other `unsafe` appears.
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Panics and placeholders.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
# Indexing and slicing that can panic; byte slicing of strings.
indexing_slicing = "deny"
string_slice = "deny"
# Lossy conversions: only in the units module, under one module-level expect.
as_conversions = "deny"
# Matches and results that hide cases.
wildcard_enum_match_arm = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
# Lint exceptions must be `#[expect]` with a reason.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Debugging leftovers and stray output.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# The methods listed in clippy.toml: output and Pango layouts each have one sanctioned path.
disallowed_methods = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = "symbols"

# For sysprof: the release build with line tables and symbols.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
