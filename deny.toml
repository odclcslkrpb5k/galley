# cargo-deny 0.20 (docs/plan.md §7).

[graph]
all-features = false
# The viewer is built for Linux only; crates other platforms would pull in (rustls'
# platform verifier bundles root certificates on some) are not part of what ships.
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
# Advisories for vulnerabilities, unsound crates and yanked versions fail the gate. Unmaintained
# notices fail only for our direct dependencies: an unmaintained crate deep in the GTK stack is
# not ours to replace, and would otherwise block every push.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# A licence not on this list fails the gate until it is reviewed and added.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # Reviewed 2026-10-12 (M4): permissive, MIT-equivalent; ring, rustls-webpki and untrusted
    # (TLS for remote images) use it.
    "ISC",
]
confidence-threshold = 0.93
# The allow-list is a reviewed set, not an inventory; an entry no crate uses yet is fine.
unused-allowed-license = "allow"

# One crate needs the older Unicode data licence, so it is allowed for that crate only:
# permissive, OSI-approved, the predecessor of Unicode-3.0. Reviewed 2026-10-11.
[[licenses.exceptions]]
crate = "finl_unicode"
allow = ["Unicode-DFS-2016"]

[licenses.private]
# Our own crates are unpublished (publish = false) and carry no licence yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "anyhow", reason = "errors are typed enums in our own words (docs/plan.md §7)" },
    { crate = "comrak", wrappers = ["galley-core"], reason = "only core may parse; the renderer sees core's model (docs/plan.md §3)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
